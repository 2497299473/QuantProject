[pytest]
# V4-A（2026-09-17）：测试分层 marker 注册。
# 分层事实来源是 tests/layers.py；tests/conftest.py 按该清单自动打 marker。
# 日常：pytest -m fast        提交前 / 夜间：pytest -m "slow or integration"
# 注：本项目主路径是 unittest（环境未装 pytest），本文件仅在装了 pytest 时生效。
testpaths = tests
markers =
    fast: 纯函数 / 契约 / 解析器；无重依赖，不碰真实数据与输出
    slow: 模型 / 回测 / 真实数据 / 网络耦合
    integration: 跨模块端到端
    research: 研究协议 / 预注册判据
